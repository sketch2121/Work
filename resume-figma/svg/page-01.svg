    <text id="주요_경력_A·B에서_어떤_관점으로_어떤_업무를_수행했는지_적습니다._다" xml:space="preserve" x="80" y="365.09" font-size="18" font-weight="300" fill="#222222" letter-spacing="-0.54">주요 경력 A·B에서 어떤 관점으로 어떤 업무를 수행했는지 적습니다. 다룬 대상을 구체적으로 씁니다.</text>
