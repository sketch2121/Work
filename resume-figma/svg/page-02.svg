<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1356" viewBox="0 0 960 1356" font-family="Pretendard, 'Noto Sans KR', sans-serif">
<rect id="background" width="960" height="1356" fill="#FFFFFF"/>
  <g id="page-title">
    <text id="강점" xml:space="preserve" x="80" y="70.04" font-size="22" font-weight="700" fill="#111111" letter-spacing="-0.44">강점</text>
  </g>
  <g id="rule">
    <rect x="80" y="94" width="800" height="2" fill="#222222"/>
  </g>
  <g id="strength-1">
    <text id="강점_1_—_핵심_역량을_'~하는_능력'_형태의_한_문장으로_적습니다" xml:space="preserve" x="80" y="144.04" font-size="22" font-weight="600" fill="#111111" letter-spacing="-0.44">강점 1 — 핵심 역량을 '~하는 능력' 형태의 한 문장으로 적습니다</text>
    <text id="이_강점이_드러난_경험의_맥락을_적습니다._어느_조직에서_어떤_대상을_다" xml:space="preserve" y="188.09"><tspan x="80" font-size="18" font-weight="300" fill="#222222" letter-spacing="-0.36">이 강점이 드러난 경험의 맥락을 적습니다. 어느 조직에서 어떤 대상을 다루었는지 밝히고, </tspan><tspan x="683.03" font-size="18" font-weight="700" fill="#111111" letter-spacing="-0.36">어떤 기준으로 판단하고</tspan></text>
    <text id="행동했는지_굵게_강조합니다._문장은_두_줄_안팎으로_유지합니다." xml:space="preserve" y="217.09"><tspan x="80" font-size="18" font-weight="700" fill="#111111" letter-spacing="-0.36">행동했는지 굵게 강조</tspan><tspan x="224.36" font-size="18" font-weight="300" fill="#222222" letter-spacing="-0.36">합니다. 문장은 두 줄 안팎으로 유지합니다.</tspan></text>
    <text id="구체적_사례를_적습니다._회사명과_프로젝트명을_밝히고,_핵심_행동과_결과" xml:space="preserve" y="256.09"><tspan x="80" font-size="18" font-weight="300" fill="#222222" letter-spacing="-0.36">구체적 사례를 적습니다. 회사명과 프로젝트명을 밝히고, </tspan><tspan x="461.58" font-size="18" font-weight="700" fill="#111111" letter-spacing="-0.36">핵심 행동과 결과를 수치로 강조</tspan><tspan x="674.3" font-size="18" font-weight="300" fill="#222222" letter-spacing="-0.36">합니다. 이해관계자, 제약</tspan></text>
    <text id="조건,_내가_내린_결정을_함께_쓰면_설득력이_높아집니다." xml:space="preserve" x="80" y="285.09" font-size="18" font-weight="300" fill="#222222" letter-spacing="-0.36">조건, 내가 내린 결정을 함께 쓰면 설득력이 높아집니다.</text>
    <text id="추가_사례가_있다면_한_문단_더_적습니다._서로_다른_조직에서의_사례를_" xml:space="preserve" y="324.09"><tspan x="80" font-size="18" font-weight="300" fill="#222222" letter-spacing="-0.36">추가 사례가 있다면 한 문단 더 적습니다. 서로 다른 조직에서의 사례를 묶으면 </tspan><tspan x="602.92" font-size="18" font-weight="700" fill="#111111" letter-spacing="-0.36">역량이 반복해서 재현된다는 근거</tspan><tspan x="827.05" font-size="18" font-weight="300" fill="#222222" letter-spacing="-0.36">가</tspan></text>
    <text id="됩니다._마지막_문장은_결과로_끝맺습니다." xml:space="preserve" x="80" y="353.09" font-size="18" font-weight="300" fill="#222222" letter-spacing="-0.36">됩니다. 마지막 문장은 결과로 끝맺습니다.</text>
  </g>
  <g id="divider">
    <rect x="80" y="406.5" width="800" height="1" fill="#E1E1E1"/>
  </g>
  <g id="strength-2">
    <text id="강점_2_—_두_번째_핵심_역량을_구체적인_한_문장으로_정의합니다" xml:space="preserve" x="80" y="471.04" font-size="22" font-weight="600" fill="#111111" letter-spacing="-0.44">강점 2 — 두 번째 핵심 역량을 구체적인 한 문장으로 정의합니다</text>
    <text id="강점의_정의를_한_번_더_풀어_씁니다._단순한_업무_나열을_넘어_이_역량" xml:space="preserve" y="515.09"><tspan x="80" font-size="18" font-weight="300" fill="#222222" letter-spacing="-0.36">강점의 정의를 한 번 더 풀어 씁니다. 단순한 업무 나열을 넘어 </tspan><tspan x="492.56" font-size="18" font-weight="700" fill="#111111" letter-spacing="-0.36">이 역량이 조직에 어떤 가치를 주는지</tspan><tspan x="739.47" font-size="18" font-weight="300" fill="#222222" letter-spacing="-0.36">를 적습니다. 판단</tspan></text>
    <text id="기준과_일하는_방식을_함께_드러냅니다." xml:space="preserve" x="80" y="544.09" font-size="18" font-weight="300" fill="#222222" letter-spacing="-0.36">기준과 일하는 방식을 함께 드러냅니다.</text>
    <text id="대표_사례를_적습니다._어떤_상황에서_누구와_일했고,_어떤_근거로_합의를" xml:space="preserve" y="583.09"><tspan x="80" font-size="18" font-weight="300" fill="#222222" letter-spacing="-0.36">대표 사례를 적습니다. 어떤 상황에서 누구와 일했고, </tspan><tspan x="435.17" font-size="18" font-weight="700" fill="#111111" letter-spacing="-0.36">어떤 근거로 합의를 이끌었는지</tspan><tspan x="648.06" font-size="18" font-weight="300" fill="#222222" letter-spacing="-0.36">적습니다. 경영진·고객·파트너 등</tspan></text>
    <text id="상대가_분명할수록_좋습니다._결과가_이어진_후속_의사결정까지_쓰면_맥락이" xml:space="preserve" x="80" y="612.09" font-size="18" font-weight="300" fill="#222222" letter-spacing="-0.36">상대가 분명할수록 좋습니다. 결과가 이어진 후속 의사결정까지 쓰면 맥락이 완성됩니다.</text>
  </g>
  <g id="divider_2">
    <rect x="80" y="665.5" width="800" height="1" fill="#E1E1E1"/>
  </g>
  <g id="strength-3">
    <text id="강점_3_—_활용하는_프레임워크나_방법론이_있다면_제목에_드러냅니다" xml:space="preserve" x="80" y="730.04" font-size="22" font-weight="600" fill="#111111" letter-spacing="-0.44">강점 3 — 활용하는 프레임워크나 방법론이 있다면 제목에 드러냅니다</text>
    <text id="프레임워크의_구성_요소와_적용_방식을_짧게_설명합니다._기존_업무와_인접" xml:space="preserve" y="774.09"><tspan x="80" font-size="18" font-weight="300" fill="#222222" letter-spacing="-0.36">프레임워크의 구성 요소와 적용 방식을 짧게 설명합니다. </tspan><tspan x="461.44" font-size="18" font-weight="700" fill="#111111" letter-spacing="-0.36">기존 업무와 인접 영역을 어떻게 연결하는지</tspan><tspan x="757.89" font-size="18" font-weight="300" fill="#222222" letter-spacing="-0.36">적으면 확장성이</tspan></text>
    <text id="드러납니다." xml:space="preserve" x="80" y="803.09" font-size="18" font-weight="300" fill="#222222" letter-spacing="-0.36">드러납니다.</text>
    <text id="이_방식을_적용한_사례를_적습니다._회사_A에서는_어떤_선택지를_비교해_" xml:space="preserve" y="842.09"><tspan x="80" font-size="18" font-weight="300" fill="#222222" letter-spacing="-0.36">이 방식을 적용한 사례를 적습니다. 회사 A에서는 </tspan><tspan x="411.56" font-size="18" font-weight="700" fill="#111111" letter-spacing="-0.36">어떤 선택지를 비교해 무엇을 결정했는지</tspan><tspan x="685.06" font-size="18" font-weight="300" fill="#222222" letter-spacing="-0.36">, 회사 B에서는 어떤 검토</tspan></text>
    <text id="기준을_세웠는지_적습니다._후보군_도출,_우선순위_정리_등_구체적인_산출" xml:space="preserve" x="80" y="871.09" font-size="18" font-weight="300" fill="#222222" letter-spacing="-0.36">기준을 세웠는지 적습니다. 후보군 도출, 우선순위 정리 등 구체적인 산출물을 함께 언급합니다.</text>
  </g>
</svg>
