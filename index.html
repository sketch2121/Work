<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIE–NC Weekly 회의록</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --panel-2:#fbfbfd; --text:#15181d; --muted:#616b7a;
    --line:#e3e6ec; --accent:#2f5bd7; --accent-soft:#eaf0ff;
    --ok:#1a7f52; --ok-soft:#e6f5ee; --warn:#9a6207; --warn-soft:#fdf3e0;
    --risk:#b2322c; --risk-soft:#fdecea; --chip:#eef1f6;
    --radius:14px; --maxw:1180px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0e1116; --panel:#161a21; --panel-2:#1b2029; --text:#e8ebf0; --muted:#9aa4b2;
      --line:#272d38; --accent:#7ea2ff; --accent-soft:#1b2540;
      --ok:#5fd0a0; --ok-soft:#12281f; --warn:#e5b567; --warn-soft:#2a2313;
      --risk:#f28b82; --risk-soft:#2c1817; --chip:#222835;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0e1116; --panel:#161a21; --panel-2:#1b2029; --text:#e8ebf0; --muted:#9aa4b2;
    --line:#272d38; --accent:#7ea2ff; --accent-soft:#1b2540;
    --ok:#5fd0a0; --ok-soft:#12281f; --warn:#e5b567; --warn-soft:#2a2313;
    --risk:#f28b82; --risk-soft:#2c1817; --chip:#222835;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",
      "Noto Sans KR",Segoe UI,Roboto,sans-serif;
    line-height:1.62; -webkit-font-smoothing:antialiased;
  }
  a{color:var(--accent)}
  .wrap{max-width:var(--maxw); margin:0 auto; padding:28px 16px 80px}
  header.top{display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; margin-bottom:22px}
  .brand h1{font-size:20px; margin:0; letter-spacing:-.01em}
  .brand p{margin:2px 0 0; color:var(--muted); font-size:13px}
  .btn{
    background:var(--panel); border:1px solid var(--line); color:var(--text);
    border-radius:999px; padding:7px 14px; font-size:13px; cursor:pointer;
  }
  .btn:hover{border-color:var(--accent)}
  .layout{display:grid; grid-template-columns:230px 1fr; gap:22px; align-items:start}
  @media (max-width:860px){ .layout{grid-template-columns:1fr} }
  nav.weeks{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:10px; position:sticky; top:16px;
  }
  @media (max-width:860px){ nav.weeks{position:static} }
  nav.weeks h2{font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); margin:6px 8px 10px}
  nav.weeks button{
    display:block; width:100%; text-align:left; background:transparent; border:0; color:var(--text);
    padding:9px 10px; border-radius:9px; cursor:pointer; font-size:14px; line-height:1.35;
  }
  nav.weeks button span{display:block; font-size:12px; color:var(--muted)}
  nav.weeks button:hover{background:var(--panel-2)}
  nav.weeks button[aria-current="true"]{background:var(--accent-soft); color:var(--accent); font-weight:600}
  nav.weeks button[aria-current="true"] span{color:var(--accent)}
  main{min-width:0}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:22px; margin-bottom:18px}
  .card > h3{
    margin:0 0 14px; font-size:13px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted);
  }
  .title-block h2{margin:0 0 6px; font-size:26px; letter-spacing:-.02em}
  .meta{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}
  .chip{background:var(--chip); border-radius:999px; padding:4px 11px; font-size:12.5px; color:var(--muted)}
  .chip b{color:var(--text); font-weight:600}
  .summary{font-size:15.5px; margin:0}
  ul.clean{margin:0; padding-left:18px}
  ul.clean li{margin:6px 0}
  .topic{border-top:1px solid var(--line); padding:16px 0}
  .topic:first-of-type{border-top:0; padding-top:0}
  .topic h4{margin:0 0 8px; font-size:16px; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .tag{font-size:11px; padding:2px 8px; border-radius:999px; font-weight:600; letter-spacing:.02em}
  .tag.deal{background:var(--accent-soft); color:var(--accent)}
  .tag.legal{background:var(--warn-soft); color:var(--warn)}
  .tag.ops{background:var(--ok-soft); color:var(--ok)}
  .stance{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px}
  @media (max-width:640px){ .stance{grid-template-columns:1fr} }
  .stance div{background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:14px}
  .stance strong{display:block; font-size:12px; color:var(--muted); margin-bottom:4px; letter-spacing:.03em}
  table{width:100%; border-collapse:collapse; font-size:14px}
  th,td{text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:top}
  th{font-size:12px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); font-weight:600}
  td.who{white-space:nowrap; font-weight:600}
  td.due{white-space:nowrap; color:var(--muted)}
  .state{font-size:11.5px; padding:2px 9px; border-radius:999px; white-space:nowrap}
  .state.open{background:var(--warn-soft); color:var(--warn)}
  .state.done{background:var(--ok-soft); color:var(--ok)}
  .state.hold{background:var(--risk-soft); color:var(--risk)}
  .risk{background:var(--risk-soft); border-left:3px solid var(--risk); border-radius:8px; padding:10px 12px; margin:8px 0; font-size:14px}
  .note{background:var(--panel-2); border:1px dashed var(--line); border-radius:10px; padding:12px 14px; font-size:13.5px; color:var(--muted)}
  details.quotes{margin-top:6px}
  details.quotes summary{cursor:pointer; font-size:13.5px; color:var(--accent)}
  blockquote{
    margin:12px 0; padding:8px 0 8px 14px; border-left:2px solid var(--line);
    font-size:13.5px; color:var(--muted)
  }
  blockquote b{color:var(--text); font-weight:600; display:block; font-size:12.5px; margin-bottom:2px}
  footer{margin-top:28px; color:var(--muted); font-size:12.5px; text-align:center}
  @media print{
    body{background:#fff} nav.weeks,.btn{display:none} .layout{grid-template-columns:1fr}
    .card{break-inside:avoid; border-color:#ccc}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>SIE–NC Weekly 회의록</h1>
      <p>주간 정기 회의 기록 · 매주 업데이트</p>
    </div>
    <button class="btn" id="themeBtn" type="button">화면 모드 전환</button>
  </header>

  <div class="layout">
    <nav class="weeks" aria-label="회차 목록">
      <h2>회차</h2>
      <div id="weekList"></div>
    </nav>
    <main id="content" aria-live="polite"></main>
  </div>

  <footer>원문: Clova Note 자동 전사(clovanote.naver.com) 기반 정리 · 대외비</footer>
</div>

  ],
  quotes: [
    ["SIE 02:05", "In our discussions with Hector … we see that as a pretty important milestone … moving straight on to long form drafting seems like a great way to spend a lot of money on lawyers."],

    ["SIE 04:16", "A 200 billion won investment would get us to about [4.]75, and it would require you to then immediately do a 200 billion won buyback in the next 12 months to then subsequently push us over five percent."],
    ["NC 05:32", "We currently have no plans to have buybacks during the next 12 months for now."],
    ["SIE 06:22", "Primarily the burden of filing and the potential risk that certain elements of the commercial agreement would need to be disclosed publicly."],

/* ------------------------------ 렌더링 ------------------------------ */
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const stateLabel = { open:"진행중", done:"완료", hold:"대기" };

function renderMeeting(m){
  const meta = m.meta.map(([k,v]) => `<span class="chip">${esc(k)} <b>${esc(v)}</b></span>`).join("");

  const topics = m.topics.map(t => `
    <div class="topic">
      <h4><span class="tag ${t.tag}">${esc(t.tagLabel)}</span>${esc(t.title)}</h4>
      <ul class="clean">${t.points.map(p => `<li>${esc(p)}</li>`).join("")}</ul>
      ${t.stance ? `<div class="stance">${t.stance.map(([w,s]) =>
        `<div><strong>${esc(w)}</strong>${esc(s)}</div>`).join("")}</div>` : ""}
      ${t.risk ? `<div class="risk">⚠ ${esc(t.risk)}</div>` : ""}
    </div>`).join("");

  const actions = m.actions.map(([who,what,due,st]) => `
    <tr>
      <td class="who">${esc(who)}</td>
      <td>${esc(what)}</td>
      <td class="due">${esc(due)}</td>
      <td><span class="state ${st}">${stateLabel[st] || esc(st)}</span></td>
    </tr>`).join("");

  const quotes = m.quotes.map(([who,q]) =>
    `<blockquote><b>${esc(who)}</b>“${esc(q)}”</blockquote>`).join("");

  return `
    <section class="card title-block">
      <h2>${esc(m.title)}</h2>
      <p class="summary">${esc(m.summary)}</p>
      <div class="meta">${meta}</div>
    </section>

    <section class="card">
      <h3>한눈에 보기</h3>
      <ul class="clean">${m.headlines.map(h => `<li>${esc(h)}</li>`).join("")}</ul>
    </section>

    ${m.carryover ? `<section class="card">
      <h3>이월 항목 (지난 회차 후속)</h3>
      <table>
        <thead><tr><th>항목</th><th>현재 상태</th><th>구분</th></tr></thead>
        <tbody>${m.carryover.map(([item,note,st]) => `
          <tr><td>${esc(item)}</td><td>${esc(note)}</td>
          <td><span class="state ${st}">${stateLabel[st] || esc(st)}</span></td></tr>`).join("")}
        </tbody>
      </table>
    </section>` : ""}

    <section class="card">
      <h3>논의 내용</h3>
      ${topics}
    </section>

    <section class="card">
      <h3>합의 · 결정 사항</h3>
      <ul class="clean">${m.decisions.map(d => `<li>${esc(d)}</li>`).join("")}</ul>
    </section>

    <section class="card">
      <h3>Action items</h3>
      <table>
        <thead><tr><th>담당</th><th>내용</th><th>기한</th><th>상태</th></tr></thead>
        <tbody>${actions}</tbody>
      </table>
    </section>

    <section class="card">
      <h3>미결 이슈</h3>
      <ul class="clean">${m.open.map(o => `<li>${esc(o)}</li>`).join("")}</ul>
    </section>

    <section class="card">
      <h3>원문 발췌</h3>
      <details class="quotes"><summary>주요 발언 원문 보기</summary>${quotes}</details>
    </section>

    <section class="card">
      <h3>기록 유의사항</h3>
      <div class="note"><ul class="clean">${m.caveats.map(c => `<li>${esc(c)}</li>`).join("")}</ul></div>
    </section>`;
}

function renderNav(activeId){
  document.getElementById("weekList").innerHTML = MEETINGS.map(m => `
    <button type="button" data-id="${esc(m.id)}" aria-current="${m.id === activeId}">
      ${esc(m.label)}<span>${esc(m.sub)}</span>
    </button>`).join("");
  document.querySelectorAll("#weekList button").forEach(b => {
    b.addEventListener("click", () => show(b.dataset.id));
  });
}

function show(id){
  const m = MEETINGS.find(x => x.id === id) || MEETINGS[0];
  document.getElementById("content").innerHTML = renderMeeting(m);
  renderNav(m.id);
  if (location.hash.slice(1) !== m.id) history.replaceState(null, "", "#" + m.id);
}

/* 테마 토글 (저장 실패해도 동작에는 영향 없음) */
const themeBtn = document.getElementById("themeBtn");
try {
  const saved = localStorage.getItem("wk-theme");
  if (saved) document.documentElement.setAttribute("data-theme", saved);
} catch (e) {}
themeBtn.addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const next = cur ? (cur === "dark" ? "light" : "dark") : (dark ? "light" : "dark");
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("wk-theme", next); } catch (e) {}
});

show(location.hash.slice(1) || MEETINGS[0].id);
</script>
</body>
</html>
